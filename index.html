<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="box-outer">
      <div class="box">
        <div class="box-content-grid">
          <!-- Row 1: Play/Pause, Marquee, Skip Left, Skip Right -->
          <div class="s1-play">
            <button class="button-target" id="play-pause-btn"><div class="button-icon">▶</div></button>
          </div>
          
          <div class="s2-marquee">
            <div class="panel-target">
              <div class="panel-icon" id="marquee">Song Title</div>
            </div>
          </div>
          
          <div class="s3-skip-left">
            <button class="button-target" id="prev-btn"><div class="button-icon">⏮</div></button>
          </div>
          
          <div class="s4-skip-right">
            <button class="button-target" id="next-btn"><div class="button-icon">⏭</div></button>
          </div>

          <!-- Row 2: Progress Bar, Time Text -->
          <div class="s5-progress">
            <div class="panel-target">
              <div class="panel-icon">
                <input type="range" id="progress-bar" min="0" max="100" value="0" style="width: 100%;">
              </div>
            </div>
          </div>
          
          <div class="s6-time">
            <div class="panel-target">
              <div class="panel-icon" id="time-display">0:00</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="wavangel.js"></script>
  </body>
</html>
