<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>HTML 5 Boilerplate</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="box-outer">
    <div class="box">
  <div class="box-content-grid">
    <div class="s1-marquee">
      <button class="panel-target">
        <div class="panel-icon"></div>
      </button>
    </div>
    
    
    <div class="s2-time">
      <button class="panel-target">
        <div class="panel-icon"></div>
      </button>
    </div>
    <div class="s3-progress">
      <button class="panel-target">
        <div class="panel-icon"></div>
      </button>
    </div>

    <div class="s4-buttons">
  <button class="button-target" id="shuffle-btn"><div class="button-icon">l</div></button>
  <button class="button-target" id="play-btn"><div class="button-icon">pl</div></button>
  <button class="button-target" id="pause-btn"><div class="button-icon">pa</div></button>
  <button class="button-target" id="next-btn"><div class="button-icon">r</div></button>
</div>
<div class="s5-controls">
  <button class="control-target" id="loop-btn"><div class="button-icon"></div></button>
  <button class="control-target"><div class="button-icon"></div></button>
</div>

  </div>
</div>
</div>

<script src="wav-angel.js"></script>
  </body>
</html>
